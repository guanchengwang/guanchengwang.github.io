# ---------------------------------------------------------------------------
# places.yaml — the travel map on the homepage
# ---------------------------------------------------------------------------
# Add a place, run `python3 scripts/build_worldmap.py`, and the map redraws.
# Coordinates are plain decimal degrees: positive lat = north, positive lon =
# east. Copying the pair from any map site is accurate enough — at this size a
# few kilometres of error is invisible.
#
# `category` is either `work` (highlighted, pulsing) or `visited`. Only the
# current work location is singled out.
#
# `country` groups the list under the map. Countries appear in the order they
# are first used below, so reorder these entries to reorder the list.
# ---------------------------------------------------------------------------

categories:
  work:    { label: "Lived &amp; worked" }
  visited: { label: "Visited" }

places:
