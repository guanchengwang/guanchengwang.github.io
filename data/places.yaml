# ---------------------------------------------------------------------------
# places.yaml — the travel map on the homepage
# ---------------------------------------------------------------------------
# Add a place, run `python3 scripts/build_worldmap.py`, and the map redraws.
# Coordinates are plain decimal degrees: positive lat = north, positive lon =
# east. Looking a city up on any map site and copying the pair is enough —
# the map is small, so a few kilometres of error is invisible.
#
# `category` must match a key under `categories:` below; it sets the marker
# colour and the legend.
# ---------------------------------------------------------------------------

categories:
  home:       { label: "Lived &amp; worked" }
  conference: { label: "Conferences &amp; talks" }
  visited:    { label: "Visited" }

places:
  # --- Confirmed ----------------------------------------------------------
  - name: "Limerick, Ireland"
    lat: 52.6638
    lon: -8.6267
    category: home
    note: "Lero, University of Limerick — current"

  - name: "Beijing, China"
    lat: 39.9042
    lon: 116.4074
    category: home
    note: "Peking University — Ph.D."

