    year: 2016
    month: "December"
    type: journal
    venue: "Journal of Software (软件学报)"
    venue_short: "JOS"
    note: "in Chinese"
    language: "zh"
    topics: ["Compiler Testing", "Program Analysis"]

# ---------------------------------------------------------------------------
# merge — collapse an arXiv preprint into its published version.
# Fuzzy title matching handles most cases automatically; list a pair here only
# when the preprint was retitled between arXiv and camera-ready.
# The preprint disappears from the list and its arXiv link moves onto the
# published entry.
# ---------------------------------------------------------------------------
merge:
  - preprint: "On Mutation-Guided Unit Test Generation"
    published: "Mutation-Guided Unit Test Generation With a Large Language Model"
  - preprint: "Hallucination to Consensus: Multi-Agent LLMs for End-to-End Test Generation with Accurate Oracles"
    published: "Hallucination to Consensus: Multi-Agent LLMs for End-to-End Test Generation with Accurate Oracles"

# ---------------------------------------------------------------------------
# hide — exact titles to drop entirely (name collisions, withdrawn work).
# ---------------------------------------------------------------------------
hide: []

# ---------------------------------------------------------------------------
# links — artifacts per paper, keyed by title. Add as you release them.
# Supported keys: pdf, code, slides, video, poster, data
# ---------------------------------------------------------------------------
links:
  "Probabilistic Delta Debugging":
    code: "https://github.com/Amocy-Wang/ProbDD"
  "A Probabilistic Delta Debugging Approach for Abstract Syntax Trees":
    code: "https://github.com/Amocy-Wang/T-PDD"
  "Mutation-Guided Unit Test Generation With a Large Language Model":
    code: "https://github.com/Amocy-Wang/MUTGEN"
  "Call-Chain-Aware LLM-Based Test Generation for Java Projects":
    code: "https://github.com/Amocy-Wang/CAT"
