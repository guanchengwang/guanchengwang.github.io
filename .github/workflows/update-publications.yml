name: Refresh publications

# Rebuilds the publication list from DBLP every day, derives news items from
# anything that changed, commits if there is a difference, and republishes.
#
# Runs on a schedule, and can be triggered by hand from the Actions tab
# ("Run workflow") whenever a paper is accepted and you don't want to wait.

on:
  schedule:
    # 04:17 UTC daily. An off-the-hour minute avoids the congestion (and the
    # long queue delays) that GitHub's shared runners see exactly on the hour.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild publications, news and map
        run: |
          python scripts/update_publications.py
          python scripts/build_worldmap.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications.bib \
                  data/news-auto.json index.html publications.html
          if git diff --staged --quiet; then
            echo "No change — publication record is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh publications and news from DBLP"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pages cannot be enabled from a workflow (configure-pages' `enablement`
      # needs a PAT, not GITHUB_TOKEN). Probe the real configuration instead:
      # deploy only when Pages is set to build from Actions, and skip with a
      # clear note otherwise, so a setting that is merely unset never fails a run.
      - name: Is Pages set to build from Actions?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo '{}')
          build_type=$(printf '%s' "$body" \
            | python3 -c "import json,sys;print((json.load(sys.stdin).get('build_type') or ''))" \
            2>/dev/null || echo '')
          echo "detected build_type: '$build_type'"
          if [ "$build_type" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            if [ -z "$build_type" ]; then
              echo "::warning title=GitHub Pages is not enabled::Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Skipping the deploy so this run does not fail."
            else
              echo "::warning title=Pages builds from a branch::Source is '$build_type', so the site publishes straight from main and this deploy step is unnecessary. Skipping it."
            fi
          fi

      - uses: actions/configure-pages@v6
        if: steps.check.outputs.enabled == 'true'
      # upload-pages-artifact v5 excludes hidden files by default, unlike v3.
      # That is what we want here: it keeps .git and .github out of the
      # artifact, and .nojekyll is unnecessary because an Actions-based deploy
      # never runs Jekyll in the first place.
      - uses: actions/upload-pages-artifact@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          path: .

  deploy:
    needs: refresh
    if: needs.refresh.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
