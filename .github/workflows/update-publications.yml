name: Refresh publications

# Rebuilds the publication list from DBLP + Google Scholar every day, commits
# the result if anything changed, and republishes the site.
#
# Runs on a schedule, and can be triggered by hand from the Actions tab
# ("Run workflow") whenever a paper is accepted and you don't want to wait.

on:
  schedule:
    # 04:17 UTC daily. An off-the-hour minute avoids the congestion (and the
    # long queue delays) that GitHub's shared runners see exactly on the hour.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Rebuild publication list
        run: python scripts/update_publications.py

      - name: Commit if anything changed
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json data/publications.bib index.html
          if git diff --staged --quiet; then
            echo "No change — publication record is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh publications from DBLP and Google Scholar"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
