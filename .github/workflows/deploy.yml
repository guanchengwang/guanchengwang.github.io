name: Deploy site

# Publishes the site whenever you push a change by hand (editing the bio,
# adding a news item, tweaking styles). The nightly publication refresh
# deploys itself, so it is deliberately not triggered from here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v7

      # Pages cannot be enabled from a workflow (configure-pages' `enablement`
      # needs a PAT, not GITHUB_TOKEN), so a repo where the setting has not
      # been flipped yet would fail on every push and email about it. Detect
      # that case and skip the deploy instead, leaving a clear note in the log.
      - name: Is Pages enabled?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then re-run this workflow. Skipping the deploy so this run does not fail."
          fi

      - uses: actions/configure-pages@v6
        if: steps.check.outputs.enabled == 'true'
      # upload-pages-artifact v5 excludes hidden files by default, unlike v3.
      # That is what we want here: it keeps .git and .github out of the
      # artifact, and .nojekyll is unnecessary because an Actions-based deploy
      # never runs Jekyll in the first place.
      - uses: actions/upload-pages-artifact@v5
        if: steps.check.outputs.enabled == 'true'
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
